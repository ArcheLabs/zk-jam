[workspace]
resolver = "2"
members = [
  "crates/refine-interface",
  "crates/statement",
  "crates/translation",
  "crates/openvm-backend",
  "crates/native",
  "crates/benchmark",
  "crates/cli",
]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "Apache-2.0"
authors = ["ZK-JAM contributors"]

[workspace.dependencies]
blake2b_simd = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
