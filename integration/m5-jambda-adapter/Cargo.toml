[package]
name = "zk-jam-m5-jambda-adapter"
version = "0.1.0"
edition = "2021"

[workspace]

[dependencies]
blake2b_simd = "1"
jam-codec = { version = "0.1.1", features = ["std"] }
jambda-refine = { package = "jambda-refine", path = "../../.m3-deps/jambda/crates/refine" }
jambda-state-backend = { path = "../../.m3-deps/jambda/crates/state-backend" }
jp-core-primitives = { path = "../../.m3-deps/jambda/crates/core-primitives" }
jp-vm-engine = { path = "../../.m3-deps/jambda/vm/engine", features = ["std"] }
jp-vm-interp = { path = "../../.m3-deps/jambda/vm/interp", features = ["std"] }
jp-vm-predecode = { path = "../../.m3-deps/jambda/vm/predecode", features = ["std"] }
zk-jam-refine-interface = { path = "../../crates/refine-interface" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
