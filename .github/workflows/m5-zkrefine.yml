name: ZK-JAM M5 ZkRefine Core

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  OPENVM_RUST_TOOLCHAIN: nightly-2026-01-18

jobs:
  m5-zkrefine:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout zk-jam
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Install pinned OpenVM guest toolchain
        run: rustup toolchain install nightly-2026-01-18 --profile minimal --component rust-src
      - name: Read pinned Jambda manifest
        id: jambda
        run: |
          repository="$(jq -er '.repository' integration/jambda-m3.json)"
          revision="$(jq -er '.revision' integration/jambda-m3.json)"
          [[ "$revision" =~ ^[0-9a-fA-F]{40}$ ]]
          echo "repository=$repository" >> "$GITHUB_OUTPUT"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
      - name: Create Jambda GitHub App token
        id: jambda-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.JAMBDA_APP_CLIENT_ID }}
          private-key: ${{ secrets.JAMBDA_APP_PRIVATE_KEY }}
          owner: ArcheLabs
          repositories: |
            jambda
          permission-contents: read
      - name: Checkout pinned Jambda
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.jambda.outputs.repository }}
          ref: ${{ steps.jambda.outputs.revision }}
          token: ${{ steps.jambda-token.outputs.token }}
          path: .m3-deps/jambda
          persist-credentials: false
      - name: Verify pinned provenance
        run: |
          test "$(git -C .m3-deps/jambda rev-parse HEAD)" = "${{ steps.jambda.outputs.revision }}"
      - name: Run lightweight workspace checks
        run: |
          cargo fmt --all -- --check
          cargo check --workspace
          cargo +${OPENVM_RUST_TOOLCHAIN} fmt --manifest-path integration/m5-jambda-adapter/Cargo.toml -- --check
      - name: Build real Jambda M5 adapter
        run: |
          cargo build --release --manifest-path integration/m5-jambda-adapter/Cargo.toml
      - name: Run one real M5 Refine proof and binding acceptance
        env:
          ZK_JAM_JAMBDA_REVISION: ${{ steps.jambda.outputs.revision }}
        run: |
          cargo run --release -p zk-jam -- m5-zkrefine \
            --jambda-repo .m3-deps/jambda \
            --adapter integration/m5-jambda-adapter/target/release/zk-jam-m5-jambda-adapter \
            --output benchmarks/results/m5-zkrefine
      - name: Enforce M5 fail-closed acceptance
        run: |
          report=benchmarks/results/m5-zkrefine/m5-zkrefine.json
          test -s "$report"
          test "$(jq -r '.complete' "$report")" = true
          test "$(jq -r '.reference.result_match' "$report")" = true
          test "$(jq -r '.reference.exports_match' "$report")" = true
          test "$(jq -r '.work_report.package_hash_match' "$report")" = true
          test "$(jq -r '.work_report.result_match' "$report")" = true
          test "$(jq -r '.work_report.exports_root_match' "$report")" = true
          test "$(jq -r '.work_report.exports_count_match' "$report")" = true
          test "$(jq -r '.work_report.gas_verified' "$report")" = false
          test "$(jq -r '.proof.verified' "$report")" = true
          test "$(jq -r '.proof.serialized_reload_verified' "$report")" = true
          test "$(jq -r '.host_calls.fetch_modes | join(",")' "$report")" = 6
          test "$(jq -r '.fixture.segment_bytes' "$report")" = 4104
      - name: Upload M5 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: m5-zkrefine-${{ github.sha }}-${{ github.run_id }}
          if-no-files-found: error
          path: benchmarks/results/m5-zkrefine
      - name: Publish M5 report
        run: cat benchmarks/results/m5-zkrefine/m5-zkrefine.json >> "$GITHUB_STEP_SUMMARY"
