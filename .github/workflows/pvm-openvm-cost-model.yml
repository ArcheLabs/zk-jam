name: PVM → OpenVM Cost Model

on:
  workflow_dispatch:
  push:
    paths:
      - "crates/cost-model/**"
      - "crates/openvm-backend/**"
      - "crates/translation/**"
      - "crates/refine-interface/**"
      - "benchmarks/schema/pvm-openvm-cost-model-v1.schema.json"
      - ".github/workflows/pvm-openvm-cost-model.yml"

permissions:
  contents: read

jobs:
  cost-model:
    name: Static and metered PVM → OpenVM cost model
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build cost-model CLI
        run: cargo build -p zk-jam --release
      # This workflow intentionally performs no ZK proving.
      - name: Run static and metered analysis
        run: ./target/release/zk-jam cost-model ci --output benchmarks/results/cost-model
      - name: Validate schema and report completeness
        run: |
          test -s benchmarks/results/cost-model/cost-model-static.json
          test -s benchmarks/results/cost-model/cost-model-trace.json
          test -s benchmarks/results/cost-model/cost-model-combined.json
          test -s benchmarks/results/cost-model/pvm-openvm-cost-model.md
          grep -q '"pvm-openvm-cost-model-v1"' benchmarks/results/cost-model/cost-model-combined.json
      - name: Upload cost model artifact
        uses: actions/upload-artifact@v4
        with:
          name: pvm-openvm-cost-model-${{ github.sha }}-${{ github.run_id }}
          path: benchmarks/results/cost-model
